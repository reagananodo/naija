
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NAIJA RUN - Game</title>
    <link rel="stylesheet" href="./style.css">

    <style>
        * { box-sizing: border-box; }

        #gameMenu {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 15px;
            padding: 20px;
        }

        #gameMenu button, #gameOver button,
        #mobileControls button {
            padding: 13px 22px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            touch-action: manipulation;
        }

        #game {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            touch-action: none;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .hud {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            z-index: 5;
            display: flex;
            justify-content: space-around;
            color: white;
            font-weight: bold;
            pointer-events: none;
        }

        #mobileControls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-evenly;
            z-index: 10;
        }

        #mobileControls button {
            width: 58px;
            height: 58px;
            padding: 0;
            border-radius: 50%;
            background: rgba(0,0,0,0.7);
            color: white;
            border: 2px solid white;
            font-size: 23px;
            user-select: none;
            -webkit-user-select: none;
        }

        #mobileControls button:active {
            background: #e89b16;
            transform: scale(0.92);
        }

        #gameOver {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background: rgba(0,0,0,0.85);
            color: white;
            text-align: center;
        }

        @media (max-width: 600px) {
            .hud { font-size: 13px; }
            #gameMenu h1 { font-size: 32px; }
        }
    </style>
</head>

<body>

    <div id="gameMenu">
        <h1>🇳🇬 NAIJA RUN</h1>
        <h2 id="welcome"></h2>
        <p>Welcome to the Lagos streets!</p>

        <h3>CHOOSE YOUR RUNNER</h3>
        <button onclick="chooseRunner('Aki')">AKI</button>
        <button onclick="chooseRunner('Pawpaw')">PAWPAW</button>

        <h3 id="selectedRunner">Selected: Aki</h3>

        <button onclick="launchGame()">START RUNNING</button>
        <button onclick="logout()">LOG OUT</button>
    </div>

    <div id="game" style="display:none">

        <div class="hud">
            <div>🇳🇬 NAIJA RUN</div>
            <div id="score">SCORE: 0</div>
            <div id="coins">🪙 0</div>
        </div>

        <canvas id="canvas"></canvas>

        <div id="mobileControls">
            <button type="button" onclick="moveLeft()">◀</button>
            <button type="button" onclick="moveRight()">▶</button>
            <button type="button" onclick="jump()">⬆</button>
            <button type="button" onclick="slide()">⬇</button>
        </div>

        <div id="gameOver">
            <h1>GAME OVER!</h1>
            <p id="finalScore"></p>
            <button onclick="launchGame()">PLAY AGAIN</button>
            <button onclick="backToMenu()">MAIN MENU</button>
        </div>
    </div>

    <script>
        const loggedInUser = sessionStorage.getItem("naijaUser");

        if (!loggedInUser) {
            window.location.replace("./index.html");
        } else {
            document.getElementById("welcome").textContent =
                "Welcome, " + loggedInUser + "!";
        }

        let selectedRunner = "Aki";
        window.selectedCharacter = "Aki";

        function chooseRunner(name) {
            selectedRunner = name;
            window.selectedCharacter = name;
            document.getElementById("selectedRunner").textContent =
                "Selected: " + name;
        }

        async function launchGame() {
            window.selectedCharacter = selectedRunner;

            document.getElementById("gameMenu").style.display = "none";
            document.getElementById("game").style.display = "block";
            document.getElementById("gameOver").style.display = "none";

            if (typeof window.startGame === "function") {
                try {
                    await window.startGame();
                } catch (error) {
                    console.error("Game failed to start:", error);
                    alert("Game failed to start. Check the browser Console.");
                }
            } else {
                alert("Game engine not loaded. Check game.js.");
            }
        }

        function backToMenu() {
            if (typeof window.stopGame === "function") {
                window.stopGame();
            }

            document.getElementById("game").style.display = "none";
            document.getElementById("gameMenu").style.display = "flex";
        }

        function logout() {
            sessionStorage.removeItem("naijaUser");
            window.location.href = "./index.html";
        }

        // KEYBOARD CONTROLS
        document.addEventListener("keydown", function(event) {
            if (document.getElementById("game").style.display === "none") return;

            if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(event.key)) {
                event.preventDefault();
            }

            if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
                moveLeft();
            }

            if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
                moveRight();
            }

            if (event.key === "ArrowUp" || event.key === " ") {
                jump();
            }

            if (event.key === "ArrowDown" || event.key.toLowerCase() === "s") {
                slide();
            }
        });

        // MOBILE SWIPE CONTROLS
        let touchStartX = 0;
        let touchStartY = 0;

        const gameArea = document.getElementById("game");

        gameArea.addEventListener("touchstart", function(event) {
            if (event.target.closest("#mobileControls")) return;

            touchStartX = event.changedTouches[0].clientX;
            touchStartY = event.changedTouches[0].clientY;
        }, { passive: true });

        gameArea.addEventListener("touchend", function(event) {
            if (event.target.closest("#mobileControls")) return;

            const deltaX = event.changedTouches[0].clientX - touchStartX;
            const deltaY = event.changedTouches[0].clientY - touchStartY;

            if (Math.abs(deltaX) > 35 && Math.abs(deltaX) > Math.abs(deltaY)) {
                if (deltaX < 0) moveLeft();
                else moveRight();
            } else if (Math.abs(deltaY) > 35) {
                if (deltaY < 0) jump();
                else slide();
            }
        }, { passive: true });
    </script>

    <script src="./game.js"></script>
</body>
</html>
